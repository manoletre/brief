[package]
name = "brief"
version = "0.1.0"
edition = "2021"
description = "Local MCP server that collects what you work on from your chatbots and writes you a daily brief with Claude Code."

[[bin]]
name = "brief"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time", "sync", "net", "signal"] }
